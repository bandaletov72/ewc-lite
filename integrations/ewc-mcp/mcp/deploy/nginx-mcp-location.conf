# Include in an existing HTTPS server block for the dedicated MCP hostname.
# Set server_name and TLS certificate in that block. Deny other paths if this
# hostname is dedicated to MCP. Never route public traffic to the FPM socket.
location = /mcp {
    client_max_body_size 1m;
    fastcgi_pass unix:/run/php/ewc-mcp-example.sock;
    fastcgi_param SCRIPT_FILENAME /srv/ewc-mcp/direct.php;
    fastcgi_param SCRIPT_NAME /mcp;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param HTTPS $https;
    fastcgi_param HTTP_HOST $http_host;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_ACCEPT $http_accept;
    fastcgi_param HTTP_MCP_PROTOCOL_VERSION $http_mcp_protocol_version;
    fastcgi_read_timeout 30s;
}

[ewc-mcp-example]
; Example only. Create dedicated accounts, paths and service secret first.
user = ewc-example
group = ewc-example
listen = /run/php/ewc-mcp-example.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0600
pm = ondemand
pm.max_children = 2
request_terminate_timeout = 30s
clear_env = yes
env[EWC_MCP_SITE_ROOT] = /srv/ewc-example/site
env[EWC_MCP_STATE_DIR] = /srv/ewc-example/drafts
env[EWC_MCP_DIRECT_HOST] = mcp.example.com
; Inherit this one secret from the service's protected environment.
env[EWC_MCP_DIRECT_TOKEN] = $EWC_MCP_DIRECT_TOKEN
; Ensure this pool (or its parent service) is dedicated to one installation.
; env[EWC_MCP_DIRECT_WRITES] = 1
; env[EWC_MCP_DIRECT_PUBLISH] = 1

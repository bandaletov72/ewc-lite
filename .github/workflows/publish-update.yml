name: Publish signed CMS update

on:
  push:
    branches: [main]
    paths:
      - updates/release.json
      - .github/workflows/publish-update.yml
  workflow_dispatch:

concurrency: publish-signed-update

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/cms-assets"
          snapshot="$RUNNER_TEMP/cms-snapshot"
          mkdir "$assets" "$snapshot"
          git -C "$snapshot" init --quiet
          git -C "$snapshot" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$snapshot" fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$snapshot" checkout --quiet --detach FETCH_HEAD
          cd "$snapshot"
          version=$(jq -er '.version | strings' updates/release.json)
          latest=$(jq -er '.version | strings' updates/latest.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $latest =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1) == "$version" ]]
          tag=v$version
          cp "full/$tag/php-site.zip" "updates/$tag/php-site-update.zip" "$assets/"
          signature="updates/$tag/php-site-update.zip.sig"
          if [[ -f "$signature" ]]; then
            cp "$signature" "$assets/"
          fi
          unzip -tq "$assets/php-site.zip"
          unzip -tq "$assets/php-site-update.zip"
          unzip -p "$assets/php-site.zip" php-site/maintenance/release-public.pem > "$assets/public.pem"
          echo "7d1d57014ddb4642aebf7c4dfd0593f75326933c25685957228b82e5d6143d3b  $assets/public.pem" | sha256sum -c -
          [[ $(unzip -p "$assets/php-site-update.zip" manifest.json | jq -er '.version') == "$version" ]]
          printf 'CMS_RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Sign and verify the update
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cms-assets"
          if [[ ! -f php-site-update.zip.sig ]]; then
            if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
              echo "::error::Missing repository secret RELEASE_SIGNING_KEY"
              exit 1
            fi
            umask 077
            key=$(mktemp)
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
            unset RELEASE_SIGNING_KEY
            openssl dgst -sha256 -sign "$key" -passin pass: -out php-site-update.zip.sig php-site-update.zip
          fi
          openssl dgst -sha256 -verify public.pem -signature php-site-update.zip.sig php-site-update.zip

      - name: Publish GitHub Release and the fallback update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/cms-assets"
          cd "$RUNNER_TEMP/cms-snapshot"
          tag=v$CMS_RELEASE_VERSION
          signature="updates/$tag/php-site-update.zip.sig"
          cp "$assets/php-site-update.zip.sig" "$signature"
          jq -c '{version} + (if (.notes | type) == "string" then {notes} else {} end)' updates/release.json > updates/latest.json
          jq -r '.notes // "Full package, update archive and signature."' updates/release.json > "$assets/release-notes.txt"
          git add -- "$signature" updates/latest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish signed CMS update $tag"
            gh auth setup-git --hostname github.com
            git push origin HEAD:refs/heads/main
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --latest \
              --title "Eurowebcart CMS Lite $CMS_RELEASE_VERSION" --notes-file "$assets/release-notes.txt" \
              "$assets/php-site.zip" "$assets/php-site-update.zip" "$assets/php-site-update.zip.sig"
          fi

name: Publish signed CMS update

on:
  push:
    branches: [main]
    paths:
      - updates/release.json
      - .github/workflows/publish-update.yml
  workflow_dispatch:

concurrency: publish-signed-update

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/cms-assets"
          snapshot="$RUNNER_TEMP/cms-snapshot"
          mkdir "$assets" "$snapshot"
          git -C "$snapshot" init --quiet
          git -C "$snapshot" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$snapshot" fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$snapshot" checkout --quiet --detach FETCH_HEAD
          cd "$snapshot"
          version=$(jq -er '.version | strings' updates/release.json)
          latest=$(jq -er '.version | strings' updates/latest.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $latest =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1) == "$version" ]]
          tag=v$version
          shop_version=$(jq -r '.shopVersion // empty' updates/release.json)
          if [[ -n "$shop_version" ]]; then
            base=$(jq -er '.baseVersion | strings' updates/release.json)
            [[ $base =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $shop_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            if [[ -f "updates/overlays/$tag.zip" ]]; then
              python3 -m zipfile -e "updates/overlays/$tag.zip" "$RUNNER_TEMP/cms-overlay"
              mkdir -p "updates/overlays/$tag"
              cp -Rn "$RUNNER_TEMP/cms-overlay/." "updates/overlays/$tag/"
            fi
            python3 .github/build-marketplace-release.py . "full/v$base/php-site.zip" \
              "updates/v$base/php-site-update.zip" "updates/overlays/$tag" "$assets"
            unzip -tq "$assets/marketplace.zip"
            [[ $(unzip -p "$assets/marketplace.zip" manifest.json | jq -er '.version') == "$shop_version" ]]
          else
            full="full/$tag/ewc-lite.zip"; [[ -f "$full" ]] || full="full/$tag/php-site.zip"
            update="updates/$tag/ewc-lite-update.zip"; [[ -f "$update" ]] || update="updates/$tag/php-site-update.zip"
            cp "$full" "$assets/php-site.zip"
            cp "$update" "$assets/php-site-update.zip"
          fi
          signature="updates/$tag/php-site-update.zip.sig"
          canonical_signature="updates/$tag/ewc-lite-update.zip.sig"
          if [[ -f "$canonical_signature" ]]; then
            cp "$canonical_signature" "$assets/php-site-update.zip.sig"
          elif [[ -f "$signature" ]]; then
            cp "$signature" "$assets/"
          fi
          unzip -tq "$assets/php-site.zip"
          unzip -tq "$assets/php-site-update.zip"
          unzip -p "$assets/php-site.zip" php-site/maintenance/release-public.pem > "$assets/public.pem"
          echo "7d1d57014ddb4642aebf7c4dfd0593f75326933c25685957228b82e5d6143d3b  $assets/public.pem" | sha256sum -c -
          [[ $(unzip -p "$assets/php-site-update.zip" manifest.json | jq -er '.version') == "$version" ]]
          printf 'CMS_RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Sign and verify the update
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cms-assets"
          if [[ ! -f php-site-update.zip.sig || -f marketplace.zip ]]; then
            if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
              echo "::error::Missing repository secret RELEASE_SIGNING_KEY"
              exit 1
            fi
            umask 077
            key=$(mktemp)
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
            unset RELEASE_SIGNING_KEY
            if [[ ! -f php-site-update.zip.sig ]]; then
              openssl dgst -sha256 -sign "$key" -passin pass: -out php-site-update.zip.sig php-site-update.zip
            fi
            if [[ -f marketplace.zip ]]; then
              openssl dgst -sha256 -sign "$key" -passin pass: -out marketplace.zip.sig marketplace.zip
              openssl dgst -sha256 -sign "$key" -passin pass: -out php-site.zip.sig php-site.zip
              if [[ -d integrations ]]; then
                while IFS= read -r -d '' package; do
                  openssl dgst -sha256 -sign "$key" -passin pass: -out "$package.sig" "$package"
                  openssl dgst -sha256 -verify public.pem -signature "$package.sig" "$package"
                done < <(find integrations -type f -name '*.zip' -print0)
              fi
            fi
          fi
          openssl dgst -sha256 -verify public.pem -signature php-site-update.zip.sig php-site-update.zip
          if [[ -f marketplace.zip ]]; then
            openssl dgst -sha256 -verify public.pem -signature marketplace.zip.sig marketplace.zip
            openssl dgst -sha256 -verify public.pem -signature php-site.zip.sig php-site.zip
          fi

      - name: Publish GitHub Release and the fallback update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/cms-assets"
          cd "$RUNNER_TEMP/cms-snapshot"
          tag=v$CMS_RELEASE_VERSION
          signature="updates/$tag/php-site-update.zip.sig"
          if [[ -f "$assets/marketplace.zip" ]]; then
            mkdir -p "full/$tag" "updates/$tag"
            cp "$assets/php-site.zip" "$assets/php-site.zip.sig" "full/$tag/"
            cp "$assets/php-site-update.zip" "$assets/marketplace.zip" "$assets/marketplace.zip.sig" "updates/$tag/"
            jq '{version: .shopVersion, tag: ("v" + .version), notes: (.notes // "")}' updates/release.json > updates/shop-latest.json
            git add -- "full/$tag" "updates/$tag" updates/shop-latest.json
          fi
          if [[ -d "$assets/integrations" ]]; then
            mkdir -p marketplace-integrations
            cp -R "$assets/integrations/." marketplace-integrations/
            git add -- marketplace-integrations
          fi
          cp "$assets/php-site.zip" "$assets/ewc-lite.zip"
          cp "$assets/php-site-update.zip" "$assets/ewc-lite-update.zip"
          cp "$assets/php-site-update.zip.sig" "$assets/ewc-lite-update.zip.sig"
          cp "$assets/ewc-lite.zip" "full/$tag/"
          cp "$assets/ewc-lite-update.zip" "$assets/ewc-lite-update.zip.sig" "updates/$tag/"
          if [[ -f "$assets/php-site.zip.sig" ]]; then
            cp "$assets/php-site.zip.sig" "$assets/ewc-lite.zip.sig"
            cp "$assets/ewc-lite.zip.sig" "full/$tag/"
          fi
          cp "$assets/php-site-update.zip" "updates/$tag/"
          cp "$assets/php-site-update.zip.sig" "$signature"
          git add -- "full/$tag" "updates/$tag"
          python3 - "$assets/php-site-update.zip" <<'PYTHON'
          from base64 import b64decode
          import json
          from pathlib import Path
          import re
          import sys
          from zipfile import ZipFile

          release = json.loads(Path("updates/release.json").read_text())
          notes = json.loads(Path("updates/component-notes.json").read_text())
          metadata = json.loads(Path("updates/latest.json").read_text())
          metadata.update({"version": release["version"], "notes": release.get("notes", ""), "updateAsset": "ewc-lite-update.zip"})
          with ZipFile(sys.argv[1]) as archive:
              if "app/spam-defaults.php" in archive.namelist():
                  spam = json.loads(archive.read("app/spam-defaults.php").split(b"\n", 1)[1])
                  if spam.get("version"):
                      metadata["spamVersion"] = spam["version"]
                      metadata["spamNotes"] = notes["spam"].get(spam["version"], "")
              themes = {}
              for name in archive.namelist():
                  theme = re.fullmatch(r"app/starter-([a-z0-9_-]+)\.php", name)
                  if not theme:
                      continue
                  encoded = re.search(rb"'theme-version\.php' => '([A-Za-z0-9+/=]+)'", archive.read(name))
                  if not encoded:
                      continue
                  version = json.loads(b64decode(encoded.group(1), validate=True).split(b"\n", 1)[1])
                  key = theme.group(1)
                  version["notes"] = notes["themes"].get(key, {}).get(version["version"], "")
                  themes[key] = version
              if "app/theme-design.php" in archive.namelist():
                  demo = re.search(rb"const SITE_DESIGN_DEMO_VERSION = '([0-9.]+)';", archive.read("app/theme-design.php"))
                  if demo:
                      themes["demo"] = {"version": demo.group(1).decode("ascii")}
              metadata["themes"] = themes
          Path("updates/latest.json").write_text(json.dumps(metadata, ensure_ascii=False) + "\n")
          PYTHON
          jq -r '.notes // "Full package, update archive and signature."' updates/release.json > "$assets/release-notes.txt"
          git add -- "$signature" updates/latest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish signed CMS update $tag"
            gh auth setup-git --hostname github.com
            git push origin HEAD:refs/heads/main
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_assets=("$assets/ewc-lite.zip" "$assets/ewc-lite-update.zip" "$assets/ewc-lite-update.zip.sig" "$assets/php-site-update.zip" "$assets/php-site-update.zip.sig")
            if [[ -f "$assets/marketplace.zip" ]]; then
              release_assets+=("$assets/ewc-lite.zip.sig" "$assets/marketplace.zip" "$assets/marketplace.zip.sig")
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --latest \
              --title "Eurowebcart CMS Lite $CMS_RELEASE_VERSION" --notes-file "$assets/release-notes.txt" "${release_assets[@]}"
          fi
